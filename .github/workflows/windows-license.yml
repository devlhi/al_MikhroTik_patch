name: Windows lab license launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'generate-license.bat'
      - 'scripts/license_cli.py'
      - 'scripts/license_util.py'
      - 'scripts/license_server.py'
      - 'tests/test_license_cli.py'
      - 'tests/test_windows_bat.py'
      - 'tests/test_license_util.py'
      - 'license.py'
      - 'mikro.py'
      - 'sha256.py'
      - 'toyecc/**'
      - 'requirements-license.txt'
      - '.github/workflows/windows-license.yml'
  pull_request:
    paths:
      - 'generate-license.bat'
      - 'scripts/license_cli.py'
      - 'scripts/license_util.py'
      - 'scripts/license_server.py'
      - 'tests/test_license_cli.py'
      - 'tests/test_windows_bat.py'
      - 'tests/test_license_util.py'
      - 'license.py'
      - 'mikro.py'
      - 'sha256.py'
      - 'toyecc/**'
      - 'requirements-license.txt'
      - '.github/workflows/windows-license.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Native cmd.exe / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    env:
      PYTHONUTF8: '1'
      ALI_LICENSE_NO_PAUSE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install local YAML reader
        run: python -m pip install -r requirements-license.txt
      - name: Exercise real generator and batch launcher
        # Tests use temporary synthetic keys, not the workflow's lab keys.
        # A signature round-trip is not a firmware boot/activation test.
        run: python -B -m unittest tests.test_license_cli tests.test_windows_bat tests.test_license_util -v
